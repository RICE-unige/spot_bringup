      SPOT_PASSWORD: "${SPOT_PASSWORD:-}"
      SPOT_PASSWORD_FILE: "${SPOT_PASSWORD_FILE:-/run/spot-secrets/spot_password.txt}"
      LIO_SAM_IMU_TOPIC: "${FAST_LIO_IMU_TOPIC:-/fast_lio/imu}"
      SPOT_SDK_IMU_FRAME: "${FAST_LIO_IMU_FRAME:-fastlio_body}"
      SPOT_SDK_IMU_SOURCE_MODE: "${FAST_LIO_IMU_SOURCE_MODE:-auto}"
      SPOT_SDK_IMU_FALLBACK_RATE_HZ: "${FAST_LIO_IMU_FALLBACK_RATE_HZ:-100.0}"
      SPOT_SDK_IMU_FALLBACK_USE_VELOCITY_DERIVATIVE: "${FAST_LIO_IMU_FALLBACK_USE_VELOCITY_DERIVATIVE:-False}"
      SPOT_SDK_IMU_ADD_GRAVITY: "${FAST_LIO_IMU_ADD_GRAVITY:-True}"
      SPOT_SDK_IMU_GRAVITY: "${FAST_LIO_IMU_GRAVITY:-9.80511}"
    command:
      - ros2
      - run
      - spot_velodyne_config
      - spot_sdk_imu_publisher.py
    stdin_open: true
    tty: true

  fast-lio:
    profiles: ["fastlio", "fastlio-rviz", "fastlio-bridge"]
    image: spot_bringup_fastlio:humble
    container_name: fast_lio
    network_mode: host
    depends_on:
      - fastlio-imu
      - velodyne-fastlio
    volumes:
      - ./config:/spot_bringup/config:ro
      - ./maps:/spot_bringup/maps:rw
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-17}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}"
      DDS_INTERFACE: "${DDS_INTERFACE:-}"
      DDS_PEERS: "${DDS_PEERS:-}"
      FAST_LIO_CONFIG: "${FAST_LIO_CONFIG:-/spot_bringup/config/fast_lio_spot.yaml}"
      FAST_LIO_LIDAR_TOPIC: "${FAST_LIO_LIDAR_TOPIC:-/velodyne/points}"
      FAST_LIO_IMU_TOPIC: "${FAST_LIO_IMU_TOPIC:-/fast_lio/imu}"
    command:
      - run_fast_lio
    stdin_open: true
    tty: true

  fastlio-map-odom-bridge:
    profiles: ["fastlio-bridge", "fastlio-rviz"]
    image: spot_bringup_fastlio:humble
    container_name: fastlio_map_odom_bridge
    network_mode: host
    depends_on:
      - fast-lio
      - spot-driver
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-17}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}"
      DDS_INTERFACE: "${DDS_INTERFACE:-}"
      DDS_PEERS: "${DDS_PEERS:-}"
    command:
      - ros2
      - run
      - spot_velodyne_config
      - map_to_odom_tf_bridge.py
      - --ros-args
      - -p
      - map_frame:=${FAST_LIO_MAP_ODOM_MAP_FRAME:-fastlio_map}
      - -p
      - slam_base_frame:=${FAST_LIO_MAP_ODOM_SLAM_BASE_FRAME:-fastlio_body}
      - -p
      - spot_odom_frame:=${FAST_LIO_MAP_ODOM_SPOT_ODOM_FRAME:-odom}
      - -p
      - spot_base_frame:=${FAST_LIO_MAP_ODOM_SPOT_BASE_FRAME:-body}
      - -p
      - publish_rate_hz:=${FAST_LIO_MAP_ODOM_PUBLISH_RATE_HZ:-20.0}
    stdin_open: true
    tty: true

  fastlio-rviz:
    profiles: ["fastlio-rviz"]
    image: spot_bringup_driver:humble
    container_name: fastlio_rviz
    network_mode: host
    depends_on:
      - spot-driver
      - fast-lio
      - fastlio-map-odom-bridge
    volumes:
      - ./rviz:/spot_bringup/rviz:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
    environment:
      DISPLAY: "${DISPLAY:-}"
      XAUTHORITY: /root/.Xauthority
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-17}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}"
      DDS_INTERFACE: "${DDS_INTERFACE:-}"
      DDS_PEERS: "${DDS_PEERS:-}"
      SPOT_NAME: "${SPOT_NAME:-}"
      SPOT_FRAME_PREFIX: "${SPOT_FRAME_PREFIX:-}"
      RENDER_SPOT_CONFIG: "0"
    command:
      - rviz2
      - -d
      - ${FAST_LIO_RVIZ_CONFIG:-/spot_bringup/rviz/fast_lio_spot.rviz}
    stdin_open: true
    tty: true
