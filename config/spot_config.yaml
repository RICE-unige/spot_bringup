# Spot ROS 2 driver configuration template.
# This file is rendered by spot_driver_entrypoint at container start.

/**:
  ros__parameters:
    username: "${SPOT_USERNAME}"
    password: "${SPOT_PASSWORD}"
    hostname: "${SPOT_HOSTNAME}"

    auto_claim: False
    auto_power_on: False
    auto_stand: False

    metrics_rate: 0.04
    lease_rate: 1.0
    async_tasks_rate: 10.0
    robot_state_rate: 50.0
    image_rate: 15.0

    estop_timeout: 9.0
    start_estop: False

    preferred_odom_frame: "odom"
    tf_root: "odom"
    spot_name: "${SPOT_NAME}"
    frame_prefix: "${SPOT_FRAME_PREFIX}"

    cmd_duration: 0.25
    arm_cmd_duration: 1.0

    rgb_cameras: False
    initialize_spot_cam: False

    # Production MOLA SLAM uses the external Velodyne ROS driver instead.
    use_velodyne: False
    velodyne_rate: 10.0
    gripperless: False

    virtual_camera_intrinsics: [385.0, 0.0, 315.0, 0.0, 385.0, 844.0, 0.0, 0.0, 1.0]
    virtual_camera_projection_plane: [-0.15916, 0.0, 0.987253]
    virtual_camera_plane_distance: 0.5
    stitched_image_row_padding: 1182
